<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F3F1EC;font-family:'Manrope',system-ui,sans-serif}
.overlay{min-height:100svh;padding:8px;display:flex}
.sheet{flex:1;border-radius:22px;background:#16302B;color:#F3F1EC;display:flex;flex-direction:column}
.hdr{height:64px;padding:0 12px 0 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:18px;font-weight:800;letter-spacing:-.02em;color:#F3F1EC;text-decoration:none}
.close{width:44px;height:44px;border-radius:12px;background:rgba(243,241,236,.12);color:#F3F1EC;display:flex;align-items:center;justify-content:center;text-decoration:none}
nav{padding:24px 20px;display:flex;flex-direction:column}
nav a{display:flex;justify-content:space-between;align-items:center;min-height:60px;border-top:1px solid #2E4A42;color:#F3F1EC;text-decoration:none;font-size:28px;font-weight:700;letter-spacing:-.03em}
nav a:last-child{border-bottom:1px solid #2E4A42}
.group{font-size:13px;font-weight:600;color:#9FB0A8;padding:20px 0 8px}
.bottom{margin-top:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:#C9D3CD}
.dot{width:8px;height:8px;border-radius:999px;background:#C3DD6E}
.btn{display:block;text-align:center;padding:15px 20px;border-radius:12px;background:#C3DD6E;color:#0B1A17;font-size:15px;font-weight:700;text-decoration:none}
.contact{font-size:14px;color:#C9D3CD;display:flex;flex-direction:column;gap:6px}
.contact a{color:#F3F1EC;display:inline-flex;align-items:center;min-height:44px}
