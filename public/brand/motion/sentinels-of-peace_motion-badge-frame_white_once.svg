<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000"><title>Sentinels of Peace badge frame, in motion</title><style>@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes star{from{opacity:0;transform:rotate(-90deg) scale(.2)}to{opacity:1;transform:none}}@keyframes glint{0%,84%,100%{transform:none}90%{transform:scale(1.18) rotate(8deg)}}@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translate(var(--dx),var(--dy))}to{opacity:1;transform:none}}.rim-l{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.55,0,.25,1) 0.1s both}.rim-r{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.55,0,.25,1) 0.1s both}.hair-l{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.55,0,.25,1) 0.35s both}.hair-r{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.55,0,.25,1) 0.35s both}.star{transform-box:view-box;transform-origin:500px 68px;animation:star .8s cubic-bezier(.3,1.3,.5,1) 1.3s both}.glint{transform-box:view-box;transform-origin:500px 68px;animation:glint 9s ease-in-out 4.3s 1}.flank-l{stroke-dasharray:1;animation:draw 0.9s cubic-bezier(.55,0,.25,1) 1.6s both}.flank-r{stroke-dasharray:1;animation:draw 0.9s cubic-bezier(.55,0,.25,1) 1.6s both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><path class="rim-l" pathLength="1" d="M500 977A477 477 0 0 1 500 23" fill="none" stroke="#FFFFFF" stroke-width="30"/><path class="rim-r" pathLength="1" d="M500 977A477 477 0 0 0 500 23" fill="none" stroke="#FFFFFF" stroke-width="30"/><path class="hair-l" pathLength="1" d="M500 946A446 446 0 0 1 500 54" fill="none" stroke="#FFFFFF" stroke-width="3"/><path class="hair-r" pathLength="1" d="M500 946A446 446 0 0 0 500 54" fill="none" stroke="#FFFFFF" stroke-width="3"/><g class="star"><g class="glint"><path fill="#FFFFFF" d="M500 46L503.52 64.48L513.64 68L503.52 71.52L500 90L496.48 71.52L486.36 68L496.48 64.48Z"/></g></g><path class="fla